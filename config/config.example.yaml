# finbot configuration — copy to config/config.yaml and edit.
# config.yaml is git-ignored so your tokens / portfolio never get committed.

market: A_SHARE          # currently only A-share is supported

data:
  # akshare = free web scraping (often blocked on cloud IPs);
  # tushare = token API (recommended on servers, set TUSHARE_TOKEN env); mock = offline.
  source: akshare        # akshare | tushare | mock
  # When akshare is unavailable or fails, the pipeline falls back to deterministic
  # mock data so the end-to-end skeleton always runs.
  fallback_to_mock: true
  cache_dir: data/cache
  raw_dir: data/raw
  processed_dir: data/processed
  # Local incremental warehouse (design §4 / M1): download once, update daily,
  # read locally in ms. Populated by `finbot update`.
  warehouse_dir: data/warehouse
  benchmark: "000985"    # 中证全指 — the relative-return benchmark
  history_days: 250      # initial backfill depth on first `finbot update`
  incremental_days: 10   # catch-up depth on subsequent updates
  # Universe filter applied before feature engineering.
  universe:
    exclude_st: true            # drop ST / *ST names
    exclude_new_ipo_days: 60    # drop stocks listed < N days ago
    min_amount_yi: 0.5          # min daily turnover (亿元) to be considered liquid
  news:
    sources: [eastmoney, sina, cls]   # crawled via akshare news interfaces
    lookback_hours: 24

features:
  # Toggle factor families. Each maps to a builder in finbot.features.engineering.
  technical: true        # momentum, volume, volatility, MA structure
  capital_flow: true     # main-force net inflow, large-order ratio
  sentiment: true        # news count / polarity, limit-up board sentiment
  board_linkage: true    # sector strength & leader-follower linkage
  limitup_genes: true    # historical "limit-up gene", consecutive boards, etc.

model:
  type: lightgbm         # lightgbm | rule_score
  # Redesign: rank cross-sectional FORWARD RETURNS, not limit-up events.
  task: rank_forward_return
  store_dir: models_store
  top_n: 20              # how many candidates to surface each day
  holding_period_days: 5 # H: forward-return horizon (weekly cadence)
  # Output is a relative cross-sectional ranking score, NOT a probability or guarantee.
  min_score: 0.15

strategy:
  # User portfolio is read from this file (git-ignored). See portfolio.example.json.
  portfolio_file: config/portfolio.json
  risk:
    max_position_pct: 0.15      # max single-name weight
    max_new_positions: 3        # max new buys per day
    stop_loss_pct: -0.07        # per-position stop loss
    take_profit_pct: 0.15       # per-position take profit
    max_total_exposure: 0.90    # keep cash buffer
  style: balanced               # conservative | balanced | aggressive
  rebalance_days: 5             # weekly rebalance (≈ holding period H)
  n_holdings: 12                # target basket size (8-15), dynamic membership
  enter_pct: 0.15               # buy if ranked in the top 15%
  hold_pct: 0.30                # keep holding until it drops out of top 30% (hysteresis)
  max_turnover: 0.30            # cap turnover per rebalance to control costs

schedule:
  # Times are local (Asia/Shanghai). The orchestrator runs these stages.
  timezone: Asia/Shanghai
  pre_market: "08:30"    # crawl overnight news + prep universe
  intraday: "09:40"      # first read after open (optional)
  post_market: "15:30"   # full pipeline: features -> model -> strategy -> report

report:
  output_dir: reports
  format: markdown       # markdown | html

llm:
  # The Claude Code Agents (market-analyst / stock-picker / strategy-advisor)
  # consume the JSON the CLI emits. No API key is needed for the skeleton itself;
  # interpretation happens inside Claude Code via the Skills.
  model: claude-opus-4-8
